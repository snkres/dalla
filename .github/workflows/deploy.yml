on:
  push:
    branches:
      - main
      - dev
jobs:
  build-and-deploy-dev:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build project
        run: pnpm build

      - name: Copy build files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SERVER }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "apps/platform/.next"
          target: "/root/dalla/apps/platform"
          strip_components: 0
          
      - name: Restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          timeout: 60s
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd /root/dalla
            pm2 restart dalla
            echo "Waiting for logs to be ready..."
            sleep 5
            pm2 logs --nostream --lines 100
            
  build-and-deploy-prod:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build project
        run: pnpm build

      - name: Copy build files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SERVER }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "apps/platform/.next"
          target: "/root/dalla/apps/platform"
          strip_components: 0
          
      - name: Restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          timeout: 60s
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd /root/dalla
            pm2 restart dalla
            echo "Waiting for logs to be ready..."
            sleep 5
            pm2 logs --nostream --lines 100
